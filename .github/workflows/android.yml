name: Android CI/CD

on:
  push:
    branches:
      - main
      - dev
      - 'dev-*'
      - 'jules-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies & Build Frontend
        run: |
          cd web_android
          npm install
          mkdir -p public/default-pack
          cp -r node_modules/@mattzh72/lodestone/assets/default-pack/* public/default-pack/
          ./node_modules/.bin/vite build
          mkdir -p ../app/src/main/assets/web/default-pack
          cp -r public/default-pack/* ../app/src/main/assets/web/default-pack/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      - name: Release Direct APK Asset
        uses: softprops/action-gh-release@v2
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/dev-') || startsWith(github.ref, 'refs/heads/jules-'))
        with:
          tag_name: build-${{ github.sha }}
          name: "Lodestone Previewer Build (${{ github.sha }})"
          body: "Direct uncompressed APK download available in Release Assets below."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
