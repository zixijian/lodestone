<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Shulkr Schematic Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #webgl-canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* UI Overlay */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .ui-interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group h1 {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .format-badge {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .region-select {
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    /* Floating Action Tools (Right) */
    .toolbar-right {
      position: absolute;
      right: 12px;
      top: 70px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }

    .tool-btn:active, .tool-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      transform: scale(0.95);
    }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Slicer Controls (Bottom) */
    .slicer-card {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .slicer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8b949e;
    }

    .slicer-header span strong {
      color: #38bdf8;
    }

    .slicer-slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slicer-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #30363d;
      outline: none;
    }

    .slicer-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #8b949e;
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="webgl-canvas-container"></div>

    <div class="ui-overlay">
      <!-- Top Header -->
      <div class="top-bar ui-interactive">
        <div class="title-group">
          <h1>Shulkr</h1>
          <span id="format-badge" class="format-badge">LITEMATIC</span>
        </div>
        <select id="region-select" class="region-select hidden">
          <option value="Main">Main Region</option>
        </select>
      </div>

      <!-- Right Floating Action Toolbar -->
      <div class="toolbar-right ui-interactive">
        <button id="btn-reset-cam" class="tool-btn" title="重置视角">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        <button id="btn-toggle-day" class="tool-btn" title="昼夜切换">
          <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
        </button>
        <button id="btn-toggle-slicer" class="tool-btn" title="切片模式">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h10v2H7z"/></svg>
        </button>
      </div>

      <!-- Bottom Slicer Card -->
      <div id="slicer-card" class="slicer-card ui-interactive hidden">
        <div class="slicer-header">
          <span>Y-Axis Layer: <strong id="layer-value">0 / 0</strong></span>
        </div>
        <div class="slicer-slider-container">
          <input type="range" id="slicer-slider" class="slicer-slider" min="0" max="100" value="100" />
        </div>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text" class="loading-text">正在初始化 Shulkr 渲染核心...</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
